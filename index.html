<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR maker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Cpath d='M0 0h3v3H0zM5 0h3v3H5zM0 5h3v3H0zM5 5h1v1H5zM7 7h1v1H7z'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main>
      <section class="controls">
        <h1>QR maker</h1>

        <label class="field">
          <span>Text or URL</span>
          <textarea id="text" rows="3" spellcheck="false">https://nos.nl/l/2625909</textarea>
        </label>

        <fieldset class="modes" id="modes">
          <legend>Mode</legend>
          <label><input type="radio" name="mode" value="minimal" checked /><span>Minimal</span></label>
          <label><input type="radio" name="mode" value="logo" /><span>Logo</span></label>
          <label><input type="radio" name="mode" value="art" /><span>Art</span></label>
          <label><input type="radio" name="mode" value="dots" /><span>Dots</span></label>
        </fieldset>
        <p class="hint" id="mode-hint"></p>

        <div class="field" data-modes="logo">
          <span>Logo</span>
          <input type="file" id="logo" accept="image/*" />
        </div>
        <label class="field" data-modes="logo">
          <span>Logo size <output id="logo-size-out"></output></span>
          <input type="range" id="logo-size" min="0.1" max="0.45" step="0.01" value="0.3" />
        </label>

        <div class="field" data-modes="art">
          <span>Background image</span>
          <input type="file" id="art" accept="image/*" />
        </div>
        <label class="field" data-modes="art">
          <span>Dot size <output id="art-dot-out"></output></span>
          <input type="range" id="art-dot" min="0.3" max="0.9" step="0.05" value="0.6" />
        </label>

        <label class="field" data-modes="minimal dots">
          <span>Error correction</span>
          <select id="ecc">
            <option value="L">L · 7%, smallest code</option>
            <option value="M">M · 15%</option>
            <option value="Q">Q · 25%</option>
            <option value="H">H · 30%</option>
          </select>
        </label>

        <div class="row">
          <label class="field">
            <span>Dark</span>
            <input type="color" id="fg" value="#000000" />
          </label>
          <label class="field">
            <span>Light</span>
            <input type="color" id="bg" value="#ffffff" />
          </label>
        </div>
      </section>

      <section class="preview">
        <div class="canvas" id="preview" aria-live="polite"></div>
        <p class="stats" id="stats"></p>
        <p class="badge" id="badge"></p>
        <div class="row">
          <button type="button" id="dl-svg">Download SVG</button>
          <button type="button" id="dl-png">Download PNG</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
